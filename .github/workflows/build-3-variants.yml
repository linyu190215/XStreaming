# 一次并行构建三个变体，用于定位「超低延迟解码」里到底是哪个参数导致撕裂
#
#   v1  只删三个 output-fence 参数          → 验证是不是 fence 组
#   v2  v1 + 两个 dec-low-latency 参数      → 验证要不要连低延迟开关一起删
#   v3  删掉全部 vendor.qti-* / vendor.rtc-* → 完全回到 AOSP 标准语义
#
# 三个 APK 包名相同、都用 debug 签名，所以可以逐个 `adb install -r` 覆盖安装，
# 不需要卸载。测试顺序建议 v1 → v2 → v3，每测一个记录「是否撕裂 / 延迟手感」。
#
# 用法：
#   1. Fork 仓库
#   2. 把本文件放到 .github/workflows/build-3-variants.yml
#   3. Actions → build-3-variants → Run workflow
#   4. 跑完在 Artifacts 里下载 app-v1 / app-v2 / app-v3
#
# 注意：
#   - 必须 macOS runner：项目里 nanoRustHostTag 只处理 darwin 路径
#   - 只编 arm64-v8a，构建时间减半（-PreactNativeArchitectures=arm64-v8a）
#   - debug 包需要 Metro：npx react-native start + adb reverse tcp:8081 tcp:8081

name: build-3-variants

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-13
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: v1
            keys: "vendor.qti-ext-output-sw-fence-enable.value,vendor.qti-ext-output-fence.enable,vendor.qti-ext-output-fence.fence_type"
          - id: v2
            keys: "vendor.qti-ext-output-sw-fence-enable.value,vendor.qti-ext-output-fence.enable,vendor.qti-ext-output-fence.fence_type,vendor.qti-ext-dec-low-latency.enable,vendor.rtc-ext-dec-low-latency.enable"
          - id: v3
            keys: "ALL_QTI"

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK / CMake / build-tools
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-34" \
                     "build-tools;34.0.0" \
                     "ndk;23.1.7779620" \
                     "cmake;3.22.1"

      - name: Set up Node 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Enable Corepack
        run: corepack enable

      - name: Install JS dependencies
        run: yarn install

      - name: Set up Rust with Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Apply variant ${{ matrix.id }}
        env:
          KEYS: ${{ matrix.keys }}
        run: |
          python3 - <<'PY'
          import os, re, sys
          p = 'android/app/src/main/java/com/xstreaming/webrtc/LowLatencyVideoDecoder.java'
          src = open(p).read()
          keys = os.environ['KEYS'].strip()
          if keys == 'ALL_QTI':
              pat = re.compile(r'\s*putInt\(format, "vendor\.(?:qti|rtc)-ext[^"]*"[^;]*;')
          else:
              want = '|'.join(re.escape(k.strip()) for k in keys.split(',') if k.strip())
              pat = re.compile(r'\s*putInt\(format, "(' + want + r')"[^;]*;')
          out, n = pat.subn('', src)
          if n == 0:
              print('ERROR: no keys matched, refusing to build', file=sys.stderr)
              sys.exit(1)
          open(p, 'w').write(out)
          print('removed %d putInt lines' % n)
          PY
          git --no-pager diff --stat || true
          git --no-pager diff || true

      - name: Build ${{ matrix.id }}
        working-directory: android
        run: |
          ./gradlew assembleDevDebug --no-daemon --stacktrace \
            -PreactNativeArchitectures=arm64-v8a

      - name: Rename and upload
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/dev/debug/*.apk out/app-${{ matrix.id }}.apk
          ls -lh out

      - uses: actions/upload-artifact@v4
        with:
          name: app-${{ matrix.id }}
          path: out/app-${{ matrix.id }}.apk
          if-no-files-found: error
