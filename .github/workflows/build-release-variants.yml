# 构建三个变体的「release」APK：独立安装，不需要 Metro，不需要电脑
#
# 与 debug 版的区别：
#   - JS 已打包进 APK，装上就能跑
#   - 用 CI 现场生成的签名（与官方版不同）→ 安装前必须先卸载官方 xStreaming
#   - 包名 com.xstreaming（与官方版相同）
#
# 三个变体同 debug 版：
#   v1  只删三个 output-fence 参数
#   v2  v1 + 两个 dec-low-latency 参数
#   v3  删掉全部 vendor.qti-* / vendor.rtc-*

name: build-release-variants

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/build-release-variants.yml'

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: v1
            keys: "vendor.qti-ext-output-sw-fence-enable.value,vendor.qti-ext-output-fence.enable,vendor.qti-ext-output-fence.fence_type"
          - id: v2
            keys: "vendor.qti-ext-output-sw-fence-enable.value,vendor.qti-ext-output-fence.enable,vendor.qti-ext-output-fence.fence_type,vendor.qti-ext-dec-low-latency.enable,vendor.rtc-ext-dec-low-latency.enable"
          - id: v3
            keys: "ALL_QTI"

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install NDK / CMake / build-tools
        run: |
          SDK="${ANDROID_HOME:-/Users/runner/Library/Android/sdk}"
          echo "using SDK: $SDK"
          ls "$SDK" || true
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          export PATH="$SDK/cmdline-tools/latest/bin:$SDK/platform-tools:$PATH"
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-34" \
                     "build-tools;34.0.0" \
                     "ndk;23.1.7779620" \
                     "cmake;3.22.1"

      - name: Set up Node 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Enable Corepack
        run: corepack enable

      - name: Install JS dependencies
        env:
          YARN_ENABLE_IMMUTABLE_INSTALLS: "false"
          YARN_ENABLE_TELEMETRY: "0"
          YARN_NETWORK_TIMEOUT: "600000"
        run: |
          node -v
          yarn --version || true
          yarn install --no-immutable
          ls node_modules | head -20

      - name: Set up Rust with Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Apply variant ${{ matrix.id }}
        env:
          KEYS: ${{ matrix.keys }}
        run: |
          python3 - <<'PY'
          import os, re, sys
          p = 'android/app/src/main/java/com/xstreaming/webrtc/LowLatencyVideoDecoder.java'
          src = open(p).read()
          keys = os.environ['KEYS'].strip()
          if keys == 'ALL_QTI':
              pat = re.compile(r'\s*putInt\(format, "vendor\.(?:qti|rtc)-ext[^"]*"[^;]*;')
          else:
              want = '|'.join(re.escape(k.strip()) for k in keys.split(',') if k.strip())
              pat = re.compile(r'\s*putInt\(format, "(' + want + r')"[^;]*;')
          out, n = pat.subn('', src)
          if n == 0:
              print('ERROR: no keys matched', file=sys.stderr)
              sys.exit(1)
          open(p, 'w').write(out)
          print('removed %d putInt lines' % n)
          PY

      - name: Generate signing keystore
        working-directory: android/app
        run: |
          keytool -genkeypair -v \
            -keystore release.keystore \
            -alias xstreaming \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass testpass123 -keypass testpass123 \
            -dname "CN=xstreaming-test, OU=test, O=test, L=test, S=test, C=CN"

      - name: Build release APK
        working-directory: android
        run: |
          ./gradlew assembleProdRelease --no-daemon --stacktrace \
            -PreactNativeArchitectures=arm64-v8a \
            -PXSTREAMING_RELEASE_STORE_FILE=release.keystore \
            -PXSTREAMING_RELEASE_STORE_PASSWORD=testpass123 \
            -PXSTREAMING_RELEASE_KEY_ALIAS=xstreaming \
            -PXSTREAMING_RELEASE_KEY_PASSWORD=testpass123

      - name: Collect and upload
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/prod/release/*.apk out/xstreaming-${{ matrix.id }}-release.apk
          ls -lh out

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.id }}
          path: out/xstreaming-${{ matrix.id }}-release.apk
          if-no-files-found: error
