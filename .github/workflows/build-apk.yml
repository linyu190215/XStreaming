# 构建可安装的 release APK（签名固定，可以直接覆盖升级）
#
# 签名用的是仓库自带的 debug.keystore（密码 android / 别名 androiddebugkey），
# 所以每次构建出来的 APK 签名都一样，不需要卸载重装、也不会丢设置。
#
# 触发：
#   - 每次 main 有更新（包括 sync-upstream 合并上游之后）
#   - 手动：Actions → build-apk → Run workflow
#
# 产物：Actions 运行页面底部的 Artifacts → xstreaming-release
#       注意：Artifacts 90 天后过期，重要版本请及时下载备份。

name: build-apk

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install NDK / CMake / build-tools
        run: |
          SDK="${ANDROID_HOME:-/Users/runner/Library/Android/sdk}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          export PATH="$SDK/cmdline-tools/latest/bin:$SDK/platform-tools:$PATH"
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-34" \
                     "build-tools;34.0.0" \
                     "ndk;23.1.7779620" \
                     "cmake;3.22.1"

      - name: Set up Node 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Set up Rust with Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Install JS dependencies
        env:
          YARN_ENABLE_IMMUTABLE_INSTALLS: "false"
          YARN_ENABLE_TELEMETRY: "0"
        run: |
          node -v
          # 这个补丁的 hunk 行号对不上，patch-package 解析失败；纯样式调整，跳过即可
          rm -f patches/react-native-paper+5.12.5.patch
          mkdir -p .yarn/releases
          curl -fsSL https://repo.yarnpkg.com/4.2.2/packages/yarnpkg-cli/bin/yarn.js -o .yarn/releases/yarn-4.2.2.cjs
          node .yarn/releases/yarn-4.2.2.cjs --version
          node .yarn/releases/yarn-4.2.2.cjs install || true
          test -d node_modules/react-native || (echo "node_modules 缺失，安装失败" && exit 1)

      - name: Build release APK (fixed signature)
        working-directory: android
        run: |
          ./gradlew assembleProdRelease --no-daemon --stacktrace \
            -PreactNativeArchitectures=arm64-v8a \
            -PXSTREAMING_RELEASE_STORE_FILE=debug.keystore \
            -PXSTREAMING_RELEASE_STORE_PASSWORD=android \
            -PXSTREAMING_RELEASE_KEY_ALIAS=androiddebugkey \
            -PXSTREAMING_RELEASE_KEY_PASSWORD=android

      - name: Collect APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/prod/release/*.apk out/xstreaming-release.apk
          ls -lh out
          # 打印签名指纹，方便核对是否与上次一致
          SDK="${ANDROID_HOME:-/Users/runner/Library/Android/sdk}"
          "$SDK/build-tools/34.0.0/apksigner" verify --print-certs out/xstreaming-release.apk | head -5 || true

      - uses: actions/upload-artifact@v4
        with:
          name: xstreaming-release
          path: out/xstreaming-release.apk
          if-no-files-found: error
